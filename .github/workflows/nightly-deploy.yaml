name: Deploy

# The site's only deploy. The nightly run keeps build-time data (releases, download counts, stars,
# contributors, parity results) fresh, and the Client starts a run by this file's name after
# publishing a parity export, so keep the name.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - the account that owns the pomme-website worker

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "design/**"
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # Queue rather than cancel, so one run can't abort another's deploy halfway through.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'PommeMC/Website'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build
        env:
          # Raises the GitHub API rate limit for the build-time fetches.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
